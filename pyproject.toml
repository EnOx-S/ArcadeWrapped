[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arcadewrapper"
version = "0.1.0"
description = "A lightweight object-oriented game engine wrapper around Python Arcade."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "arcade>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "build",
    "twine",
]
